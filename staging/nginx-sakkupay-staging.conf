# ==============================================================================
# SakkuPay Staging Nginx Reverse Proxy Configuration
# Target: Staging instance running at http://127.0.0.1:3001
# ==============================================================================

upstream sakkupay_staging_backend {
    server 127.0.0.1:3001;
    keepalive 32;
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name staging.sakkupay.yourdomain.com;
    return 301 https://$host$request_uri;
}

# HTTPS Staging Gateway
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name staging.sakkupay.yourdomain.com;

    # SSL / TLS 1.3 Configuration
    ssl_certificate /etc/letsencrypt/live/staging.sakkupay.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.sakkupay.yourdomain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Maximum payload body size limit (matches server.js 1MB guard)
    client_max_body_size 1m;

    # Logging
    access_log /var/log/nginx/sakkupay_staging_access.log;
    error_log /var/log/nginx/sakkupay_staging_error.log warn;

    # Standard Proxy Headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # Real-Time Server-Sent Events (SSE) Stream
    location /api/events {
        proxy_pass http://sakkupay_staging_backend;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        chunked_transfer_encoding off;
    }

    # API and Webhook Endpoints
    location /api/ {
        proxy_pass http://sakkupay_staging_backend;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    # Static Assets & Web Application
    location / {
        proxy_pass http://sakkupay_staging_backend;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }
}
