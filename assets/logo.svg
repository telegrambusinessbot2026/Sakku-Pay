<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60" fill="none">
  <defs>
    <linearGradient id="sakku-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#6366F1" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Logo Icon Container -->
  <g transform="translate(6, 6)" filter="url(#shadow)">
    <!-- Rounded Squircle Base -->
    <rect width="48" height="48" rx="14" fill="url(#sakku-grad)" />

    <!-- Stylized S & UPI Dynamic Pulse Ribbon -->
    <path d="M34 16 C31 13, 23 13, 19 16 C15 19, 15 23, 19 25 L29 27 C34 28, 35 33, 31 36 C27 39, 18 39, 14 34"
          stroke="#FFFFFF" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" fill="none" />

    <!-- Payment Flash Lightning / Spark Accent -->
    <path d="M26 14 L20 25 L28 25 L22 36"
          stroke="#FACC15" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none" />

    <!-- Mini UPI Node -->
    <circle cx="34" cy="16" r="2.2" fill="#FACC15" />
  </g>

  <!-- Brand Typography (Dark Mode Optimized) -->
  <g transform="translate(66, 38)">
    <!-- "SakkuPay" -->
    <text font-family="'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif"
          font-size="28" font-weight="800" letter-spacing="-0.8px" fill="#FFFFFF">
      Sakku<tspan fill="#818CF8">Pay</tspan>
    </text>
    <!-- Tagline -->
    <text y="14" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif"
          font-size="9.5" font-weight="600" letter-spacing="1.4px" fill="#94A3B8" text-transform="uppercase">
      INSTANT UPI GATEWAY
    </text>
  </g>
</svg>
