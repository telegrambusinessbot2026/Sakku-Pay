<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Pay securely with SakkuPay</title>
  <link rel="icon" type="image/svg+xml" href="/assets/logo-icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/app-extra.css">
</head>
<body class="checkout-page">
  <main class="public-checkout">
    <div class="merchant" id="checkout-logo-header" style="display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:16px">
      <img src="/assets/logo.svg" alt="SakkuPay" style="height:32px">
    </div>
    <section id="pay-content">
      <div class="checkout-loading-box" id="checkout-loading-state">
        <div class="checkout-spinner" role="status" aria-label="Loading"></div>
        <p class="loading-title">Loading payment link…</p>
        <p class="loading-subtitle">Connecting securely to SakkuPay gateway</p>
      </div>
    </section>
    <small class="secured" id="checkout-secured-badge">🔒 End-to-end encrypted · 0% Gateway Commission · SakkuPay</small>
  </main>
  <script src="/qrcode.min.js"></script>
  <script>
    if (typeof QRCode === 'undefined') {
      document.write('<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"><\/script>');
    }
  </script>
  <script src="/checkout.js"></script>
</body>
</html>
